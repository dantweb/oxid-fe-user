name: CI

on:
  push:
    # feature branches get the same gate as main — no PR needed to see a branch green
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oxid-fe-user
      # file:../oxid-fe-core — sibling checkout, same layout as the SDK root.
      # CORE_DEPLOY_KEY: a READ-ONLY deploy key of dantweb/oxid-fe-core (least privilege:
      # it can read that one repo and nothing else).
      - uses: actions/checkout@v4
        with:
          repository: dantweb/oxid-fe-core
          # TEMPORARY: remove when oxid-fe-core feature/graphql-comply is merged
          ref: feature/graphql-comply
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: oxid-fe-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build oxid-fe-core
        working-directory: oxid-fe-core
        run: npm ci && npm run build
      - name: Install
        working-directory: oxid-fe-user
        run: npm ci
      - name: Lint
        working-directory: oxid-fe-user
        run: npm run lint
      - name: Type-check
        working-directory: oxid-fe-user
        run: npm run type-check
      - name: Knip
        working-directory: oxid-fe-user
        run: npm run knip
      - name: Unit tests
        working-directory: oxid-fe-user
        run: npm run test:coverage
      - name: Build
        working-directory: oxid-fe-user
        run: npm run build
      - name: Evaluate violations
        working-directory: oxid-fe-user
        run: npm run evaluate
