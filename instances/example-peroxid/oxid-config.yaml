# Example instance C — the peroxid layout plugin.
# No `theme.active`: the plugin's own `defaultTheme` (peroxid) applies. Set `theme.active` to
# override it — an instance's explicit choice always wins (docs/layout-plugins.md).
instance:
  id: example-peroxid
  name: Peroxid
shop:
  graphql_url: /graphql/
i18n:
  default_locale: en
  fallback_locale: en
  locales: [en, de]
theme:
  default: default
plugins:
  shop: {}
  checkout: {}
  payment-paypal:
    config:
      mode: iframe
      client_id: BAAWENv6dXLjKG1Q_4kvJgJF83z4nTB6KXY6O8a8P5QDTSW85kDWDNp6d1ER5ewUBcyuTL-yboprVynmWU
      currency: EUR
      intent: capture
  payment-stripe:
    config:
      mode: iframe
      publishable_key: pk_test_51TuDSdDy2vmJsUOtehDDyjW7LVux6H4KhqkKHBKtscJ0pc8TtNlCSLMpgmcLU2dHeWzmBBIOM2YsUYnSD6eoV0UQ003raZjAtm
  payment-mollie:
    config:
      mode: iframe
      profile_id: pfl_cVf8bSWdQV
      test_mode: true
      locale: en_US
      methods: [creditcard, ideal, bancontact]
  dashboard: {}
  # a layout plugin: listed last so it wins every slot it overrides
  peroxid:
    config:
      streams:
        - { id: new, type: action, ref: oxnewest }
        - { id: sales, type: action, ref: oxbargain }
        - { id: electronic, type: category, ref: 91c959d1be6af96041072032ead2daf0 }
